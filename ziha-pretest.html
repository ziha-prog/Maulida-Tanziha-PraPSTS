<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMPUTER LAB SERVICE</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-linear-to-r from-cyan-500 to-blue-500 min-h-screen p-6">
  <div class="max-w-2xl mx-auto">

    <div class="border-1 mx-10 mt-10 rounded-full bg-sky-200 shadow-xl shadow-gray-100 p-2 hover:bg-blue-300 text-center text-2xl font-bold text-blue-500 text-shadow-lg">Computer Lab Reservation System</div>

    <div class="bg-gradient-to-r from-purple-200 via-purple-400 to-purple-600 border-1 rounded-lg m-6 shadow-lg shadow-gray-100 p-2 text-center font-semibold text-gray-700">Please fill in the form below:</div>

    <form class="bg-sky-200 p-5 rounded-lg shadow">
        <label class="block font-semibold mb-2">Borrower's Name</label>
        <input type="text" class="w-full border p-2 rounded mb-4" placeholder="Enter Your Name">

        <label class="block font-semibold mb-2">Status</label>
        <div class="relative flex flex-col rounded-xl bg-none shadow-xl">
            <nav class="flex min-w-[240px] flex-col gap-1 p-2">
                <div role="button" class="flex w-full items-center rounded-lg p-0 hover:bg-blue-100">
                    <label for="status-teacher" class="flex w-full items-center px-3 py-2">
                        <div class="inline-flex items-center">
                            <label class="relative flex items-center cursor-pointer" for="status-teacher">
                                <input name="framework" type="radio" class="peer h-5 w-5 appearance-none rounded-full border border-blue-300 checked:border-white-400" id="status-teacher" checked>
                                <span class="absolute bg-green-800 w-3 h-3 rounded-full opacity-0 peer-checked:opacity-100 transition-opacity duration-200 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></span>
                            </label>
                            <label class="ml-2 text-white-600 cursor-pointer text-sm" for="status-teacher">Teacher</label>
                        </div>
                    </label>
                </div>
                <div role="button" class="flex w-full items-center rounded-lg p-0 hover:bg-blue-100">
                    <label for="status-student" class="flex w-full items-center px-3 py-2">
                        <div class="inline-flex items-center">
                            <label class="relative flex items-center cursor-pointer" for="status-student">
                                <input name="framework" type="radio" class="peer h-5 w-5 appearance-none rounded-full border border-blue-300 checked:border-white-400" id="status-student">
                                <span class="absolute bg-green-800 w-3 h-3 rounded-full opacity-0 peer-checked:opacity-100 transition-opacity duration-200 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></span>
                            </label>
                            <label class="ml-2 text-white-600 cursor-pointer text-sm" for="status-student">Student</label>
                        </div>
                    </label>
                </div>
                <div role="button" class="flex w-full items-center rounded-lg p-0 hover:bg-blue-100">
                    <label for="status-org" class="flex w-full items-center px-3 py-2">
                        <div class="inline-flex items-center">
                            <label class="relative flex items-center cursor-pointer" for="status-org">
                                <input name="framework" type="radio" class="peer h-5 w-5 appearance-none rounded-full border border-blue-300 checked:border-white-400" id="status-org">
                                <span class="absolute bg-green-800 w-3 h-3 rounded-full opacity-0 peer-checked:opacity-100 transition-opacity duration-200 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2"></span>
                            </label>
                            <label class="ml-2 text-white-600 cursor-pointer text-sm" for="status-org">Organization</label>
                        </div>
                    </label>
                </div>
            </nav>
        </div>

        <div>
            <label class="block font-semibold mb-2">Purpose</label>
            <input type="text" class="w-full border p-2 rounded mb-4" placeholder="Practicum, Practice, Meeting Organization, etc.">
        </div>

        <label class="block font-semibold mb-2">Borrowed Lab</label>
        <div class="mb-4">
            <label class="mr-4">
                <input type="radio" name="lab"> Lab 1 (Software)
            </label>
            <label>
                <input type="radio" name="lab"> Lab 2 (Hardware)
            </label>
        </div>

        <label class="block font-semibold mb-2">Date of Use</label>
        <input type="date" class="w-full border p-2 rounded mb-4">

        <label class="block font-semibold mb-2">Start Time</label>
        <input type="time" class="w-full border p-2 rounded mb-4">

        <label class="block font-semibold mb-2">End Time</label>
        <input type="time" class="w-full border p-2 rounded mb-4">

        <label class="block font-semibold mb-2">Number of Participants</label>
        <input type="number" class="w-full border p-2 rounded mb-4" placeholder="Number of participants">

        <label class="block font-semibold mb-2">Special Requirements</label>
        <textarea class="w-full border p-2 rounded mb-5" rows="4" placeholder="Need internet access, need a projector, etc."></textarea>

        <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-gray-500 mb-2">
            Submit Reservation
        </button>

        <button type="reset" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-gray-500">
            Reset
        </button>
    </form>

  </div>
</body>
</html>
