<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Lab Reservation</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-100">

    <div class="max-w-2xl mx-auto p-6">

        <h1 class=" hover:bg-blue-200 text-blue-500 text-2xl bg-blue-300 rounded-lg font-bold text-center mb-2">
           Computer Lab Reservation
        </h1>

        <p class="text-center text-gray-700 mb-6">
            Please fill in the form below
        </p>

        <form class="bg-white p-5 rounded-lg shadow">

            <!-- Borrower's Name -->
            <label class="block font-semibold mb-2">
                Borrower's Name
            </label>

            <input type="text"
                class="w-full border p-2 rounded mb-4"
                placeholder="Enter your name">


            <!-- Status -->
            <label class="block font-semibold mb-2">
                Status
            </label>

            <div class="mb-4">
                <label class="mr-4">
                    <input type="radio" name="status">
                    Teacher
                </label>

                <label class="mr-4">
                    <input type="radio" name="status">
                    Student
                </label>

                <label>
                    <input type="radio" name="status">
                    Organization
                </label>
            </div>


            <!-- Purpose -->
            <label class="block font-semibold mb-2">
                Purpose
            </label>

            <input type="text"
                class="w-full border p-2 rounded mb-4"
                placeholder="Practicum, Practice, Meeting Organization, etc.">


            <!-- Borrowed Lab -->
            <label class="block font-semibold mb-2">
                Borrowed Lab
            </label>

            <div class="mb-4">
                <label class="mr-4">
                    <input type="radio" name="lab">
                    Lab 1 (Software)
                </label>

                <label>
                    <input type="radio" name="lab">
                    Lab 2 (Hardware)
                </label>
            </div>


            <!-- Date -->
            <label class="block font-semibold mb-2">
                Date of Use
            </label>

            <input type="date"
                class="w-full border p-2 rounded mb-4">


            <!-- Start Time -->
            <label class="block font-semibold mb-2">
                Start Time
            </label>

            <input type="time"
                class="w-full border p-2 rounded mb-4">


            <!-- End Time -->
            <label class="block font-semibold mb-2">
                End Time
            </label>

            <input type="time"
                class="w-full border p-2 rounded mb-4">


            <!-- Number of Participants -->
            <label class="block font-semibold mb-2">
                Number of Participants
            </label>

            <input type="number"
                class="w-full border p-2 rounded mb-4"
                placeholder="Number of participants">


            <!-- Special Requirements -->
            <label class="block font-semibold mb-2">
                Special Requirements
            </label>

            <textarea
                class="w-full border p-2 rounded mb-5"
                rows="4"
                placeholder="Need internet access, need a projector, etc."></textarea>


            <!-- Submit -->
            <button>
                <type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-gray-500">
                Submit Reservation
            </button> 

            <button>
                <type="reset" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-gray-500">
                Reset
            </button>
            

        </form>

    </div>

</body>
</html>
